ConvertModbus-job:
  stage: Deploy
  image: qt_ubuntu:5.15
  variables:
    MODBUS_FILE: "User/ModbusSlave/ModbusSlaveUser.c"
    OUTPUT_FILE: "tfl4_cm_modbus_${CI_COMMIT_REF_SLUG}"
  tags: 
    - Docker
    - Qt5.15
  when: manual
  script:
    - mkdir out
    - ModbusConverter --version
    - ModbusConverter --no-gui -c modbusConfig.json -f ${MODBUS_FILE} -o "${OUTPUT_FILE}_EDA" -t EDA
    - ModbusConverter --no-gui -c modbusConfig.json -f ${MODBUS_FILE} -o "${OUTPUT_FILE}_IAC" -t IAC
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - out/*