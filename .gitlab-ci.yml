Ceedling-job:
  stage: Tests
  tags: 
    - Docker
    - Ceedling
  only:
    - merge_requests
    - branches
  script:
  - cd Tests
  - ceedling
  - ceedling clean
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    when: always
    paths:
      - Tests/build/artifacts/test/report_junit.xml
    reports:
      junit: Tests/build/artifacts/test/report_junit.xml

